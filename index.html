  if (k === 'reg-q') { S.reg.q = el.value; S.reg.page = 0; }
  clearTimeout(_inT); _inT = setTimeout(bump, 160);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheetOpen) { ACT.close(); return; }
  S.lastAct = Date.now();
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'scan-in') { ev.preventDefault(); ACT['scan-go'](); }
});

/* ============ offline app: people, backup, install ============ */
const APP_VERSION = '1.0.0';
function refreshRole() {
  if (S.mode !== 'local') return;
  S.isAdmin = !(S.sec && S.sec.pinHash) || !!S.unlocked;
  S.canWrite = true; bump();
}
async function hashPin(pin, salt) {
  const t = new TextEncoder().encode(salt + ':' + pin);
  if (window.crypto && crypto.subtle) {
    const h = await crypto.subtle.digest('SHA-256', t);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 2166136261; for (const b of t) { h ^= b; h = Math.imul(h, 16777619) >>> 0; }
  return 'f' + h.toString(16);
}
const hasPin = () => !!(S.sec && S.sec.pinHash);
function lockOfficer(quiet) { if (!S.unlocked) return; S.unlocked = false; refreshRole(); if (!quiet) toast('Officer mode locked.'); }
setInterval(() => { if (S.unlocked && Date.now() - (S.lastAct || 0) > 20 * 60000) { lockOfficer(true); toast('Officer mode locked after 20 minutes without activity.'); } }, 60000);
document.addEventListener('pointerdown', () => { S.lastAct = Date.now(); }, true);

function operatorSheet(first) {
  openSheet(head(first ? 'Who is using the app?' : 'You and officer access', first ? 'Your name is recorded against every verification in the audit trail.' : '') + `
    <label class="f"><span>Your name and designation</span><input id="op-name" type="text" maxlength="60" value="${esc(S.uid)}" placeholder="e.g. Smt. K. Iyer, Librarian" autofocus></label>
    ${first ? '' : `<div class="section" style="margin-top:14px">
      <h3>Officer access</h3>
      ${!hasPin() ? `<p class="small">No officer PIN is set, so everyone using this device can approve sessions, make authorized corrections and record responsibility. Set a PIN in Backup &amp; settings to restrict this.</p>`
        : S.unlocked ? `<p class="small">Officer mode is unlocked. It locks again after 20 minutes without activity.</p><button class="btn" data-act="officer-lock">Lock officer mode</button>`
        : `<p class="small">Approving, authorized corrections, recording responsibility, importing the register and restoring backups need the officer PIN.</p>
           <div class="row"><input id="op-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Officer PIN" style="max-width:180px"><button class="btn primary" data-act="officer-unlock">Unlock officer mode</button></div>`}
    </div>`}
    <div class="sheet-foot">${first ? '' : '<button class="btn" data-act="close">Close</button>'}<button class="btn primary" data-act="op-save" data-first="${first ? 1 : 0}">${first ? 'Start' : 'Save name'}</button></div>`, { label: 'Operator' });
}
let _pinFails = 0, _pinWait = 0;
async function unlockOfficer() {
  const el = $('#op-pin'); if (!el) return;
  if (Date.now() < _pinWait) return toast('Too many attempts. Wait 30 seconds.');
  const ok = (await hashPin(el.value.trim(), S.sec.salt)) === S.sec.pinHash;
  if (!ok) { el.value = ''; if (++_pinFails >= 5) { _pinWait = Date.now() + 30000; _pinFails = 0; } return toast('That PIN is not correct.'); }
  _pinFails = 0; S.unlocked = true; S.lastAct = Date.now(); refreshRole(); closeSheet();
  toast('Officer mode unlocked.');
  if (S.curBase) logEvent({ action: 'Officer mode unlocked', acc: '', prev: '', next: '', remarks: 'Authorized officer access on this device' }).catch(() => {});
}
function pinSheet() {
  openSheet(head(hasPin() ? 'Change officer PIN' : 'Set officer PIN', 'Use 4 to 12 digits. Share it only with officers authorized to approve verification.') + `
    <div class="grid2"><label class="f"><span>New PIN</span><input id="pin1" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" autofocus></label>
    <label class="f"><span>Repeat new PIN</span><input id="pin2" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password"></label></div>
    <p class="small muted" style="margin-top:8px">The PIN keeps everyday users of a shared library computer out of officer actions. It is not a substitute for locking the computer itself.</p>
    <div class="sheet-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="pin-save">Save PIN</button></div>`, { label: 'Officer PIN' });
}

/* ---------- backup ---------- */
async function downloadBackup() {
  await Local.flush();
  const data = {}; for (const [k, v] of Local.mem) data[k] = v;
  const b = { app: 'library-stock-verification', format: 1, version: APP_VERSION, exportedAt: Date.now(), by: S.uid || '', data };
  const name = `stock-verification-backup_${today()}_${(S.uid || 'device').replace(/[^A-Za-z0-9]+/g, '-').slice(0, 30)}.json`;
  await saveFile(name, new Blob([JSON.stringify(b)], { type: 'application/json' }));
  uiSet('lastBackup', Date.now()); bump();
}
async function readBackup(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { throw new Error('This file could not be read as a backup.'); }
  if (!j || j.app !== 'library-stock-verification' || !j.data) throw new Error('This file is not a stock verification backup.');
  return j;
}
async function mergeBackup(j) {
  const inc = j.data; const cur = p => Local.mem.get(p);
  const st = { sessions: 0, records: 0, updated: 0, events: 0, files: 0, skipped: 0, regAdded: false, regDiffers: false };
  const writes = []; const touched = new Set();
  for (const [p, v] of Object.entries(inc)) {
    let m;
    if ((m = p.match(/^sessions\/([^/]+)$/))) {
      const c = cur(p);
      if (!c) { writes.push([p, v]); st.sessions++; }
      else if (SESSION_STATES.indexOf(v.status) > SESSION_STATES.indexOf(c.status) && !isLocked(c)) writes.push([p, { ...c, ...v }]);
      continue;
    }
    if ((m = p.match(/^sessions\/([^/]+)\/buckets\/[^/]+$/))) {
      const ls = cur(`sessions/${m[1]}`); const locked = ls && isLocked(ls);
      const c = cur(p) || { items: {} }; const items = { ...(c.items || {}) }; let ch = 0;
      for (const [k, e] of Object.entries(v.items || {})) {
        const o = items[k];
        if (!o || (e.at || 0) > (o.at || 0)) {
          if (locked) { st.skipped++; continue; }
          if (!o) st.records++; else st.updated++;
          items[k] = e; ch++;
        }
      }
      if (ch) { writes.push([p, { ...c, items }]); touched.add(m[1]); }
      continue;
    }
    if (/^(sessions|locked\/records\/sessions)\/[^/]+\/audit\/[^/]+$/.test(p)) {
      const c = cur(p) || { events: {} }; const ev = { ...(c.events || {}) }; let ch = 0;
      for (const [k, e] of Object.entries(v.events || {})) if (!ev[k]) { ev[k] = e; ch++; }
      if (ch) { st.events += ch; writes.push([p, { ...c, events: ev }]); }
      continue;
    }
    if (/^sessions\/[^/]+\/(files|corrections)\/[^/]+$/.test(p)) {
      if (!cur(p)) { writes.push([p, v]); if (p.includes('/files/')) st.files++; }
      else if (p.includes('/corrections/') && v.state !== 'Pending' && cur(p).state === 'Pending') writes.push([p, v]);
      continue;
    }
    if (p.startsWith('locked/') || p === 'config/security') { if (!cur(p)) writes.push([p, v]); continue; }
  }
  const ir = inc['master/register'], lr = cur('master/register');
  if (ir && !lr) {
    for (const [p, v] of Object.entries(inc)) if (p.startsWith('master/register/chunks/') && v.gen === ir.gen) writes.push([p, v]);
    writes.push(['master/register', ir]); st.regAdded = true;
  } else if (ir && lr && ir.gen !== lr.gen) st.regDiffers = true;
  for (const [p, v] of writes) await Store.set(p, v);
  for (const sid of touched) {
    const s = cur(`sessions/${sid}`);
    await logEvent({ action: 'Records merged from another device', acc: '', prev: '', next: '', remarks: `Backup from ${j.by || 'another device'} exported ${fmtDT(j.exportedAt)}` }, s && s.status === 'Approved' && s.lockedAt ? `locked/records/sessions/${sid}` : `sessions/${sid}`);
  }
  return st;
}

/* ---------- settings view ---------- */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
VIEWS.settings = () => {
  const lb = uiGet('lastBackup', 0);
  const admin = S.isAdmin;
  return `<div><h1>Backup &amp; settings</h1><p class="muted">This app keeps every record on this device. It works without an internet connection once installed.</p></div>
  <div class="section"><h2>Install and offline use</h2>
    <div id="offline-status"><p class="muted small">Checking offline readiness…</p></div>
    ${isStandalone() ? '<p>Running as an installed app.</p>'
      : S.installEvt ? '<button class="btn primary" data-act="install">Install app on this device</button>'
      : isIOS() ? '<p>To install on iPhone or iPad: open this page in Safari, tap Share, then Add to Home Screen.</p>'
      : '<p>To install: open the browser menu and choose Install app (Chrome, Edge) or Add to Home screen (Android).</p>'}
  </div>
  <div class="section"><h2>Backup</h2>
    <p>${lb ? `Last backup downloaded ${fmtDT(lb)}.` : 'No backup downloaded from this device yet.'} A backup holds the stock register, every session, photographs, investigation records and the audit trail.</p>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="backup">Download backup</button>
      <label class="btn" style="cursor:pointer">Merge records from another device<input type="file" accept=".json,application/json" data-chg="merge-file" class="sr"></label>
      ${admin ? `<label class="btn danger" style="cursor:pointer">Restore from backup<input type="file" accept=".json,application/json" data-chg="restore-file" class="sr"></label>` : ''}
    </div>
    <h3 style="margin-top:16px">Verifying with several devices</h3>
    <ol class="small" style="padding-left:20px;margin:6px 0 0">
      <li>On the main library computer, load the register, create the session and download a backup.</li>
      <li>On each scanning phone or laptop, install the app and restore that backup.</li>
      <li>Give each device different racks. When scanning ends, download a backup from each device.</li>
      <li>On the main computer, use Merge records from another device for each backup. The newest record for every accession number is kept, and the merge is noted in the audit trail.</li>
    </ol>
    <p class="small muted" style="margin-top:8px">Merging never changes a session that is already submitted or approved on the receiving device.</p>
  </div>
  <div class="section"><h2>Storage on this device</h2><div id="storage-status"><p class="muted small">Checking…</p></div></div>
  <div class="section"><h2>People and officer access</h2>
    <p>Using the app as <b>${esc(S.uid || 'unnamed user')}</b>. <button class="btn sm" data-act="operator">Change name</button></p>
    ${!hasPin() ? `<div class="notice">No officer PIN is set. Anyone using this device can approve sessions, make authorized corrections and record responsibility for missing books.</div>
      ${admin ? '<button class="btn primary" data-act="pin-set">Set officer PIN</button>' : ''}`
      : `<p>${S.unlocked ? 'Officer mode is unlocked on this device.' : 'Officer actions are protected by a PIN.'}</p>
      <div class="row">${S.unlocked ? '<button class="btn" data-act="officer-lock">Lock officer mode</button><button class="btn" data-act="pin-set">Change PIN</button><button class="btn danger" data-act="pin-remove">Remove PIN</button>' : '<button class="btn primary" data-act="operator">Unlock officer mode</button>'}</div>`}
  </div>
  ${admin ? `<div class="section"><h2>Erase data</h2><p class="small">Removes the register, all sessions, photographs and the audit trail from this device, for example after trying the sample register. Download a backup first if you may need any of it.</p>
    <button class="btn danger" data-act="erase">Erase all data on this device</button></div>` : ''}
  <p class="small muted" style="margin-top:16px">Library Stock Verification, version ${APP_VERSION}</p>`;
};
async function settingsStatus() {
  const off = $('#offline-status'), sto = $('#storage-status');
  if (off) {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) {
      off.innerHTML = `<div class="notice">This copy was opened directly as a file, so it saves records but cannot be installed or prepared for offline use. Open it from its web address (https://) to install it.</div>`;
    } else {
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        const libs = [CDN.xlsx, CDN.jspdf, CDN.autotable, CDN.zxing];
        let have = 0; for (const u of libs) if (await caches.match(u)) have++;
        const shell = await caches.match(new URL('./index.html', location.href).href) || await caches.match(new URL('./', location.href).href);
        const ready = reg && shell && have === libs.length;
        if ($('#offline-status')) $('#offline-status').innerHTML = ready
          ? `<div class="notice ok">Ready to work offline. The app, PDF and Excel export, and the camera barcode reader are saved on this device.</div>`
          : `<div class="notice">Preparing for offline use (${have} of ${libs.length} tools saved). Keep the app open while connected to the internet for a minute, then check again.</div>`;
      } catch (e) { off.innerHTML = '<p class="small muted">Offline status could not be checked.</p>'; }
    }
  }
  if (sto) {
    try {
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
      const per = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
      const mb = b => (b / 1048576).toFixed(1) + ' MB';
      if (!$('#storage-status')) return;
      $('#storage-status').innerHTML = `${est ? `<p>Using ${mb(est.usage || 0)} of about ${mb(est.quota || 0)} available.</p>` : ''}
        <p>${per ? 'Storage is marked permanent: the browser will not clear it to free space.' : 'The browser may clear this data if the device runs low on space.'}</p>
        ${per ? '' : '<button class="btn sm" data-act="persist">Keep data permanently</button>'}
        ${Local.idb ? '' : '<div class="notice bad">This browser is using limited storage. Photographs may not fit; use an up-to-date Chrome, Edge, Firefox or Safari.</div>'}`;
    } catch (e) { }
  }
}

/* ---------- actions ---------- */
Object.assign(ACT, {
  operator: () => operatorSheet(false),
  'op-save': el => {
    const v = ($('#op-name') || {}).value?.trim();
    if (!v) return toast('Enter your name.');
    S.uid = v.slice(0, 60); uiSet('operator', S.uid); closeSheet(); bump();
    if (el.dataset.first === '1' && !S.regList.length) toast('Start by loading the stock register.');
  },
  'officer-unlock': () => unlockOfficer(),
  'officer-lock': () => { lockOfficer(); closeSheet(); },
  'pin-set': () => { if (!S.isAdmin) return toast('Unlock officer mode first.'); pinSheet(); },
  'pin-save': async () => {
    const a = $('#pin1').value.trim(), b = $('#pin2').value.trim();
    if (!/^\d{4,12}$/.test(a)) return toast('Use 4 to 12 digits.');
    if (a !== b) return toast('The two PINs do not match.');
    const salt = rid(); const pinHash = await hashPin(a, salt);
    S.unlocked = true; S.lastAct = Date.now();
    await Store.set('config/security', { pinHash, salt, setAt: Date.now(), setBy: S.uid });
    refreshRole(); closeSheet(); toast('Officer PIN saved. Officer mode stays unlocked until you lock it.');
  },
  'pin-remove': async () => {
    const r = await ask({ title: 'Remove the officer PIN?', body: '<p>Everyone using this device will be able to approve sessions and make authorized corrections.</p>', confirm: 'Remove PIN', danger: true });
    if (r) { await Store.del('config/security'); S.unlocked = false; toast('Officer PIN removed.'); }
  },
  backup: () => downloadBackup().catch(e => toast(e.message || 'The backup could not be created.')),
  persist: async () => { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? 'Data will be kept permanently on this device.' : 'The browser did not allow permanent storage. Installing the app usually enables it.'); bump(); },
  install: async () => {
    const e = S.installEvt; if (!e) return;
    e.prompt(); try { await e.userChoice; } catch (x) { }
    S.installEvt = null; bump();
  },
  'reload-app': async () => {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg && reg.waiting) { navigator.serviceWorker.addEventListener('controllerchange', () => location.reload()); reg.waiting.postMessage('skip-waiting'); }
    else location.reload();
  },
  erase: async () => {
    const r = await ask({ title: 'Erase all data on this device?', body: '<p>This cannot be undone. Type ERASE to confirm.</p>', confirm: 'Erase everything', danger: true, input: { label: 'Type ERASE', required: true } });
    if (r !== 'ERASE') { if (r) toast('Nothing was erased. Type ERASE exactly to confirm.'); return; }
    try { await Local.replaceAll({}); uiSet('sid', null); uiSet('lastBackup', 0); location.reload(); } catch (e) { toast(e.message); }
  }
});
document.addEventListener('change', async ev => {
  const k = ev.target.dataset && ev.target.dataset.chg;
  if (k !== 'merge-file' && k !== 'restore-file') return;
  const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (!f) return;
  let j; try { j = await readBackup(f); } catch (e) { return toast(e.message); }
  const n = Object.keys(j.data).filter(p => /\/buckets\//.test(p)).length;
  if (k === 'restore-file') {
    if (!S.isAdmin) return toast('Unlock officer mode first.');
    const r = await ask({ title: 'Replace everything on this device?', body: `<p>The backup from ${esc(j.by || 'another device')}, exported ${fmtDT(j.exportedAt)}, will replace all records on this device. Download a backup of this device first if you may need its records.</p>`, confirm: 'Restore backup', danger: true });
    if (!r) return;
    try { await Local.replaceAll(j.data); uiSet('lastBackup', Date.now()); location.reload(); } catch (e) { toast(e.message || 'The backup could not be restored.'); }
    return;
  }
  const r = await ask({ title: 'Merge records from this backup?', body: `<p>Backup from ${esc(j.by || 'another device')}, exported ${fmtDT(j.exportedAt)}. New and newer verification records, photographs and audit entries are added to this device. Nothing is deleted.</p>`, confirm: 'Merge records' });
  if (!r) return;
  try {
    const st = await mergeBackup(j);
    const parts = [`${nf(st.records)} new and ${nf(st.updated)} updated verification records`, `${nf(st.events)} audit entries`];
    if (st.files) parts.push(`${nf(st.files)} files`);
    if (st.sessions) parts.push(`${nf(st.sessions)} sessions`);
    toast('Merged: ' + parts.join(', ') + '.', 6000);
    if (st.skipped) toast(`${nf(st.skipped)} records were not merged because their session is already submitted or approved here.`, 7000);
    if (st.regDiffers) toast('The other device has a different stock register. Its register was not merged.', 7000);
  } catch (e) { toast(e.message || 'The merge could not be completed.'); }
});

/* ---------- install & service worker ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; bump(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('App installed.'); bump(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) { S.updateReady = true; bump(); } });
      });
    }).catch(() => {});
  });
}
boot();

</script>
