<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library Stock Verification</title>
<meta name="description" content="Physical stock verification and reconciliation for school libraries. Works offline.">
<meta name="theme-color" content="#1C5A45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stock Verify">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --ink:#16212B; --ink-2:#4A5764; --ink-3:#76828C;
  --rule:#D7DCD5; --rule-2:#BFC7BE;
  --green:#1C5A45; --on-green:#FFFFFF; --green-wash:#DFEDE5;
  --red:#A1271D; --red-wash:#F7E1DD; --amber:#835600; --amber-wash:#F5E8CC;
  --blue:#29508F; --blue-wash:#E0E8F5; --violet:#583D88; --violet-wash:#EAE4F4;
  --grey:#545F69; --grey-wash:#E7EAE6; --focus:#2C6FD6;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11171C; --surface:#182027; --surface-2:#1D262E; --ink:#E6EBE7; --ink-2:#A6B2BA; --ink-3:#7F8C95;
    --rule:#2A353E; --rule-2:#3A4752;
    --green:#74C6A6; --on-green:#0D2219; --green-wash:#1B372D;
    --red:#F0897E; --red-wash:#3D201C; --amber:#E2B45C; --amber-wash:#382C14;
    --blue:#93B4EE; --blue-wash:#1C2A40; --violet:#BBA3E8; --violet-wash:#2B2440;
    --grey:#AEB8BF; --grey-wash:#232D35; --focus:#8DB5FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11171C; --surface:#182027; --surface-2:#1D262E; --ink:#E6EBE7; --ink-2:#A6B2BA; --ink-3:#7F8C95;
  --rule:#2A353E; --rule-2:#3A4752;
  --green:#74C6A6; --on-green:#0D2219; --green-wash:#1B372D;
  --red:#F0897E; --red-wash:#3D201C; --amber:#E2B45C; --amber-wash:#382C14;
  --blue:#93B4EE; --blue-wash:#1C2A40; --violet:#BBA3E8; --violet-wash:#2B2440;
  --grey:#AEB8BF; --grey-wash:#232D35; --focus:#8DB5FF; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:1.75rem;line-height:1.2}
h2{font-size:1.3rem;line-height:1.25}
h3{font-size:1.05rem;line-height:1.3}
p{margin:.35rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.num,.acc{font-variant-numeric:tabular-nums lining-nums}
.acc{font-family:var(--serif);font-weight:700}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;border-right:1px solid var(--rule);background:var(--surface);padding:18px 12px 24px;display:flex;flex-direction:column;gap:2px}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--rule);margin-bottom:10px}
.brand b{display:block;font-family:var(--serif);font-size:1.15rem;line-height:1.2}
.brand span{font-size:.82rem;color:var(--ink-3)}
.nav-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2)}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--green-wash);color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--green)}
.nav-btn .cnt{font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-sep{height:1px;background:var(--rule);margin:8px 10px}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .mob-title{display:none;font-family:var(--serif);font-weight:600}
.sess-pick{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sess-pick select{max-width:420px;min-width:0;flex:1}
.role{font-size:.8rem;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:3px 10px;white-space:nowrap}
main{padding:22px 24px 96px;max-width:1240px;width:100%}
.bottomnav{display:none}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:8px 14px}
  .topbar .mob-title{display:block;width:100%}
  main{padding:16px 14px 110px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--rule);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;color:var(--ink-2);border-radius:8px;cursor:pointer}
  .bottomnav button[aria-current="page"]{color:var(--green);font-weight:600}
  .bottomnav svg{width:22px;height:22px}
  h1{font-size:1.45rem}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--rule))}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--rule-2);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--ink-2)}
label.f > span{font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.span2{grid-column:1/-1}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:.78rem;font-weight:500;white-space:nowrap;line-height:1.5;border:1px solid transparent}
.t-green{background:var(--green-wash);color:var(--green)}
.t-blue{background:var(--blue-wash);color:var(--blue)}
.t-amber{background:var(--amber-wash);color:var(--amber)}
.t-red{background:var(--red-wash);color:var(--red)}
.t-violet{background:var(--violet-wash);color:var(--violet)}
.t-grey{background:var(--grey-wash);color:var(--grey)}
.t-violet-o{border-color:var(--violet);color:var(--violet)}
.t-grey-o{border-color:var(--grey);color:var(--grey)}
.t-blue-o{border-color:var(--blue);color:var(--blue)}
.t-red-o{border-color:var(--red);color:var(--red)}
.t-pending{border:1px dashed var(--ink-3);color:var(--ink-2)}

/* sections */
.section{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px;margin-top:16px}
.section > h2,.section > h3{margin-bottom:8px}
.notice{border-left:3px solid var(--amber);background:var(--amber-wash);padding:10px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:.92rem}
.notice.info{border-color:var(--blue);background:var(--blue-wash)}
.notice.bad{border-color:var(--red);background:var(--red-wash)}
.notice.ok{border-color:var(--green);background:var(--green-wash)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty h2{color:var(--ink);margin-bottom:6px}

/* hero / progress */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--rule)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:14px}}
.hero .vid{font-family:var(--serif);color:var(--ink-2);font-size:.95rem}
.pct{font-family:var(--serif);font-weight:700;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.pct small{font-size:1.6rem;color:var(--ink-2);margin-left:2px}
.bar{height:12px;background:var(--grey-wash);border-radius:2px;overflow:hidden;margin:10px 0 6px;display:flex}
.bar i{display:block;height:100%}
.bar .b-phys{background:var(--green)}
.bar .b-acc{background:color-mix(in srgb,var(--green) 45%,var(--paper))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.states{list-style:none;margin:16px 0 0;padding:0;display:flex;gap:0;overflow-x:auto}
.states li{flex:1;min-width:110px;padding:8px 10px 8px 0;border-top:3px solid var(--rule);color:var(--ink-3);font-size:.86rem}
.states li.done{border-color:var(--green);color:var(--ink-2)}
.states li.now{border-color:var(--green);color:var(--ink);font-weight:600}
.states li b{display:block;font-family:var(--serif);font-size:.8rem;font-weight:600;color:inherit}

/* ledger grid of counts */
.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-top:18px;overflow:hidden}
@media (max-width:900px){.ledger{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cell{padding:14px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:none;border-top:0;border-left:0;text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:2px;min-height:86px}
.cell:hover{background:var(--surface-2)}
.cell .v{font-family:var(--serif);font-size:1.75rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.cell .l{font-size:.84rem;color:var(--ink-2)}
.cell .s{font-size:.76rem;color:var(--ink-3)}
.cell.k-red .v{color:var(--red)} .cell.k-amber .v{color:var(--amber)} .cell.k-violet .v{color:var(--violet)} .cell.k-blue .v{color:var(--blue)} .cell.k-green .v{color:var(--green)}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-top:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;font-size:.8rem;color:var(--ink-2);background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl td.t{min-width:200px;max-width:340px}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .sub{display:block;font-size:.8rem;color:var(--ink-3)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:.88rem;color:var(--ink-2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:12px}
.chip{border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}

/* scan */
.scanbox{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;margin-top:14px}
.scan-in{display:flex;gap:8px}
.scan-in input{font-size:1.35rem;font-family:var(--serif);font-weight:600;padding:12px 14px;letter-spacing:.02em}
.lastscan{margin-top:12px;padding:10px 12px;border-radius:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-top:14px}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--green);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}

/* stamp — the accession number as it appears in the register */
.stamp{display:inline-flex;flex-direction:column;align-items:flex-start;border:2px solid var(--ink);border-radius:4px;padding:4px 12px 3px;font-family:var(--serif);line-height:1}
.stamp small{font-family:var(--sans);font-size:.66rem;color:var(--ink-2);letter-spacing:.02em;margin-bottom:2px}
.stamp b{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums lining-nums;border-bottom:3px double var(--ink);padding-bottom:2px}
dl.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;margin:12px 0}
@media (max-width:560px){dl.kv{grid-template-columns:1fr}}
dl.kv div{border-bottom:1px solid var(--rule);padding-bottom:5px;min-width:0}
dl.kv dt{font-size:.76rem;color:var(--ink-3)}
dl.kv dd{margin:0;font-size:.92rem;overflow-wrap:anywhere}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:12px 12px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.18)}
.sheet.wide{max-width:1000px}
@media (min-width:901px){.overlay{align-items:center}.sheet{border-radius:12px;max-height:90vh}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.sheet-foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--paper);padding:12px 0 4px;margin-top:14px;border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.x{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--ink-2);padding:2px 6px}
.hist{list-style:none;padding:0;margin:8px 0 0;font-size:.86rem}
.hist li{padding:7px 0;border-bottom:1px solid var(--rule)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs button{width:72px;height:72px;border:1px solid var(--rule-2);border-radius:6px;padding:0;overflow:hidden;background:var(--surface-2);cursor:pointer;font-size:.7rem;color:var(--ink-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
details.disc{border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-top:10px}
details.disc summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.disc summary::-webkit-details-marker{display:none}
details.disc summary .n{font-family:var(--serif);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
details.disc[open] summary{border-bottom:1px solid var(--rule)}
details.disc .inner{padding:4px 14px 14px}
details.disc .tblwrap{border:0;margin-top:0}
.flow{list-style:none;padding:0;margin:10px 0 0;counter-reset:f;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.flow li{counter-increment:f;font-size:.84rem;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink-3)}
.flow li::before{content:counter(f) ". ";font-family:var(--serif);font-weight:700}
.flow li.done{color:var(--ink-2);border-color:color-mix(in srgb,var(--green) 40%,var(--rule))}
.flow li.now{color:var(--ink);border-color:var(--green);background:var(--green-wash);font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:.9rem;box-shadow:0 4px 18px rgba(0,0,0,.2);pointer-events:auto}
.banner{padding:8px 24px;font-size:.86rem;border-bottom:1px solid var(--rule)}
.banner.local{background:var(--blue-wash);color:var(--ink)}
.banner.lock{background:var(--violet-wash)}
@media (max-width:900px){.banner{padding:8px 14px}}
.preview{background:var(--grey-wash);padding:14px;border-radius:8px;overflow:auto}
.preview .page{margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#print-root{display:none}

/* A4 report pages (screen preview + print) */
.page{width:210mm;min-height:297mm;padding:16mm 15mm;background:#fff;color:#111;font:10.5pt/1.45 var(--serif);position:relative}
.page h1{font-size:17pt;text-align:center;margin-bottom:2mm;color:#111}
.page h2{font-size:13pt;margin:6mm 0 2mm;color:#111}
.page .center{text-align:center}
.page .hdr{text-align:center;border-bottom:1.5pt double #111;padding-bottom:3mm;margin-bottom:5mm}
.page .hdr b{display:block;font-size:14pt}
.page table{border-collapse:collapse;width:100%;font:9pt/1.35 var(--sans);margin-top:2mm}
.page th,.page td{border:.6pt solid #555;padding:1.6mm 2mm;text-align:left;vertical-align:top;color:#111}
.page th{background:#eee}
.page td.r{text-align:right}
.page .cert{border:1.5pt solid #111;padding:8mm;margin-top:6mm}
.page .sigs{display:grid;grid-template-columns:1fr 1fr;gap:16mm 14mm;margin-top:18mm}
.page .sig{border-top:.8pt solid #111;padding-top:2mm;font:9pt var(--sans)}
.page .draft{position:absolute;top:8mm;right:12mm;font:600 9pt var(--sans);color:#a1271d;border:1pt solid #a1271d;padding:1mm 3mm}
.page .meta td{border:0;padding:.8mm 2mm .8mm 0;font-size:10pt;font-family:var(--serif)}
.page .remark{border:.6pt solid #555;min-height:28mm;padding:3mm;white-space:pre-wrap;font-size:10pt}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  :root{padding:0}
  body.printing .app,body.printing #sheet-root,body.printing #toast{display:none!important}
  body.printing #print-root{display:block}
  .page{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
}
@media (prefers-reduced-motion:no-preference){
  .bar i{transition:width .5s ease}
}
.cam video{width:100%;max-height:60vh;background:#000;border-radius:8px}
.sheet:focus{outline:none}
[hidden]{display:none!important}
@media (min-width:720px){.sheet dl.kv{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>
'use strict';
/* ============================================================
   Library Physical Stock Verification & Reconciliation
   ============================================================ */
const CDN = {
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  autotable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',

};
const _loaded = {};
function loadScript(src) {

/* ---------- vocabulary ---------- */
const ST = {
  AV: 'Physically Available', IS: 'Issued', NF: 'Not Found', MI: 'Missing', DA: 'Damaged',
  UR: 'Under Repair', WD: 'Withdrawn', TR: 'Transferred', EX: 'Extra/Unrecorded', DU: 'Duplicate',
  WA: 'Wrong Accession Number', NV: 'Not Yet Verified'
};
const STATUS_LIST = Object.values(ST);
const TONE = {
  [ST.AV]: 'green', [ST.IS]: 'blue', [ST.NF]: 'amber', [ST.MI]: 'red', [ST.DA]: 'violet', [ST.UR]: 'violet-o',
  [ST.WD]: 'grey', [ST.TR]: 'grey-o', [ST.EX]: 'blue-o', [ST.DU]: 'red-o', [ST.WA]: 'red-o', [ST.NV]: 'pending'
};
const CONDITIONS = ['Good', 'Fair', 'Poor', 'Damaged', 'Severely Damaged', 'Termite Damaged', 'Pages Missing', 'Binding Damaged', 'Pages Oxidised', 'Water Damaged'];
const SEVERE = new Set(['Damaged', 'Severely Damaged', 'Termite Damaged', 'Pages Missing', 'Binding Damaged', 'Water Damaged']);
const WORN = new Set(['Poor', 'Pages Oxidised']);
const ACTIONS = ['Repair', 'Rebind', 'Replace', 'Withdraw', 'Continue in use'];
const RECOVERY = ['Under investigation', 'Recovered', 'Not recovered', 'Written off'];
const SESSION_STATES = ['Not Started', 'In Progress', 'Completed', 'Submitted', 'Approved'];
const PHYS = new Set([ST.AV, ST.DA, ST.UR, ST.DU, ST.WA]);
const REG_F = ['a', 't', 'au', 'p', 'ed', 'isbn', 'sub', 'cls', 'pr', 'pd', 'sup', 'bill', 'st', 'rack', 'lit', 'lid', 'lrd'];
const REG_LABEL = {
  a: 'Accession No.', t: 'Title', au: 'Author', p: 'Publisher', ed: 'Edition', isbn: 'ISBN', sub: 'Subject', cls: 'Class',
  pr: 'Price', pd: 'Date of purchase', sup: 'Supplier', bill: 'Bill No.', st: 'Register status', rack: 'Rack/location',
  lit: 'Last issued to', lid: 'Last issue date', lrd: 'Last return date'
};
const REG_STATUSES = ['Available', 'Issued', 'Withdrawn', 'Transferred', 'Lost', 'Under Repair'];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function deepMerge(t, s) {
  for (const k of Object.keys(s)) {
    const v = s[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], v);
    else t[k] = clone(v);
  }
  return t;
}
function toDate(v) {
  if (!v) return null;
  if (typeof v === 'number') return new Date(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return new Date(v + 'T00:00:00');
  const d = new Date(v); return isNaN(d) ? null : d;
}
function fmtDate(v) { const d = toDate(v); return d ? d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : (v || ''); }
function fmtDT(v) { const d = toDate(v); return d ? d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const nf = n => Number(n || 0).toLocaleString('en-IN');
function inr(n) { if (n === '' || n == null || isNaN(+n)) return ''; return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function rs(n) { if (n === '' || n == null || isNaN(+n)) return ''; return 'Rs. ' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
function pct(a, b) { return b ? (a / b * 100).toFixed(1) + '%' : '—'; }
function normAcc(s) {
  s = String(s ?? '').trim().toUpperCase().replace(/\s+/g, '');
  if (/^\d+$/.test(s)) return String(parseInt(s, 10));
  return s;
}
function accNum(a) { const m = String(a).match(/\d+/g); return m ? parseInt(m[m.length - 1], 10) : NaN; }
function cmpAcc(a, b) {
  const x = accNum(a), y = accNum(b);
  if (!isNaN(x) && !isNaN(y) && x !== y) return x - y;
  return String(a).localeCompare(String(b));
}
const keyOf = acc => String(acc).replace(/[^A-Za-z0-9_-]/g, c => '~' + c.charCodeAt(0).toString(16));
function bucketOf(acc) { const n = accNum(acc); return isNaN(n) ? 'bx' : 'b' + Math.floor(n / 100); }
const badge = (st, extra = '') => `<span class="badge t-${TONE[st] || 'grey'}">${esc(st)}${extra}</span>`;
const sbadge = st => {
  const t = { 'Not Started': 'pending', 'In Progress': 'amber', 'Completed': 'blue', 'Submitted': 'violet', 'Approved': 'green' }[st] || 'grey';
  return `<span class="badge t-${t}">${esc(st)}</span>`;
};
function toast(msg, ms = 3200) {
  const d = document.createElement('div'); d.textContent = msg; $('#toast').appendChild(d);
  setTimeout(() => d.remove(), ms);
}
function dbErr(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Storage for this register is full. Remove old photographs or documents, then try again.';
  if (c === 'invalid_argument') return 'This change was refused. You may not have permission to edit this record.';
  if (c === 'resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  if (c === 'revoked') return 'Access to this register has changed. Reload the page.';
  return (e && e.message) || 'The change could not be saved. Try again.';

/* ---------- storage: shared database, with an on-device fallback ---------- */
function idbOpen() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open('library-stock-verification', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbAll(db) {
  return new Promise((res, rej) => {
    const out = []; const c = db.transaction('kv', 'readonly').objectStore('kv').openCursor();
    c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } else res(out); };
    c.onerror = () => rej(c.error);
  });
}
const Local = {
  mem: new Map(), listeners: new Set(), idb: null, pend: new Map(), t: null, bc: null,
  async load() {
    try { this.idb = await idbOpen(); for (const [k, v] of await idbAll(this.idb)) this.mem.set(k, v); } catch (e) { this.idb = null; }

    try {
      const old = [];
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('lsv:')) old.push(k); }
      for (const k of old) { const p = k.slice(4); if (!this.mem.has(p)) { this.mem.set(p, JSON.parse(localStorage.getItem(k))); if (this.idb) this.pend.set(p, this.mem.get(p)); } }
      if (this.idb && old.length) { await this.flush(); old.forEach(k => localStorage.removeItem(k)); }
    } catch (e) { }
    try {
      this.bc = new BroadcastChannel('lsv-sync');
      this.bc.onmessage = ev => {
        const m = ev.data || {};
        if (m.reload) return location.reload();
        if (!m.path) return;
        if (m.data === null) this.mem.delete(m.path); else this.mem.set(m.path, m.data);
        this.notify(m.path);
      };
    } catch (e) { }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') this.flush(); });
    window.addEventListener('pagehide', () => this.flush());
  },
  persist(path) {
    const v = this.mem.get(path);
    if (this.bc) try { this.bc.postMessage({ path, data: v === undefined ? null : v }); } catch (e) { }
    if (!this.idb) {
      try { if (v === undefined) localStorage.removeItem('lsv:' + path); else localStorage.setItem('lsv:' + path, JSON.stringify(v)); }
      catch (e) { toast('This device has run out of storage space. Download a backup, then remove data you no longer need.'); }
      return;
    }
    this.pend.set(path, v); clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 60);
  },
  flush() {
    if (!this.idb || !this.pend.size) return Promise.resolve();
    const items = [...this.pend]; this.pend.clear();
    return new Promise(res => {
      const tx = this.idb.transaction('kv', 'readwrite'); const st = tx.objectStore('kv');
      for (const [k, v] of items) { if (v === undefined) st.delete(k); else st.put(v, k); }
      tx.oncomplete = () => res();
      tx.onerror = tx.onabort = () => { toast('This device has run out of storage space. Download a backup, then remove data you no longer need.', 6000); res(); };
    });
  },
  async replaceAll(data) {
    this.mem = new Map(Object.entries(data || {}));
    if (this.idb) {
      await new Promise((res, rej) => {
        const tx = this.idb.transaction('kv', 'readwrite'); const st = tx.objectStore('kv'); st.clear();
        for (const [k, v] of this.mem) st.put(v, k);
        tx.oncomplete = res; tx.onerror = tx.onabort = () => rej(tx.error || new Error('Storage is full.'));
      });
    } else {
      try { Object.keys(localStorage).filter(k => k.startsWith('lsv:')).forEach(k => localStorage.removeItem(k)); for (const [k, v] of this.mem) localStorage.setItem('lsv:' + k, JSON.stringify(v)); }
      catch (e) { throw new Error('This browser does not have enough storage for the backup.'); }
    }
    if (this.bc) try { this.bc.postMessage({ reload: true }); } catch (e) { }
  },
  notify(path) { for (const l of [...this.listeners]) try { l(path); } catch (e) { console.error(e); } },
  list(col) {
    const out = []; const pre = col + '/';
    for (const [p, v] of this.mem) if (p.startsWith(pre) && !p.slice(pre.length).includes('/')) out.push({ id: p.slice(pre.length), data: v });
    return out.sort((a, b) => a.id < b.id ? -1 : 1);
  }
};
const _chains = {};
function chain(path, fn) {
  const p = (_chains[path] || Promise.resolve()).catch(() => {}).then(fn);
  _chains[path] = p; return p;
}
async function retry(fn) {
  try { return await fn(); } catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return await fn(); }
    throw e;
  }
}
const Store = {
  async get(path) {
    if (S.mode === 'db') { const s = await retry(() => S.db.doc(path).get()); return s.exists ? clone(s.data()) : null; }
    return clone(Local.mem.get(path) ?? null);
  },
  set(path, data) {
    data = clone(data);
    return chain(path, async () => {
      if (S.mode === 'db') return retry(() => S.db.doc(path).set(data));
      Local.mem.set(path, clone(data)); Local.persist(path); Local.notify(path);
    });
  },
  merge(path, data) {
    data = clone(data);
    return chain(path, async () => {
      if (S.mode === 'db') {
        try { await retry(() => S.db.doc(path).update(data)); }
        catch (e) {
          if (e && e.code === 'invalid_argument') {
            const s = await S.db.doc(path).get();
            if (!s.exists) return retry(() => S.db.doc(path).set(data));
          }
          throw e;
        }
        return;
      }
      const cur = clone(Local.mem.get(path)) || {};
      Local.mem.set(path, deepMerge(cur, data)); Local.persist(path); Local.notify(path);
    });
  },
  del(path) {
    return chain(path, async () => {
      if (S.mode === 'db') return retry(() => S.db.doc(path).delete());
      Local.mem.delete(path); Local.persist(path); Local.notify(path);
    });
  },
  async list(col) {
    if (S.mode === 'db') { const q = await retry(() => S.db.collection(col).get()); return q.docs.map(d => ({ id: d.id, data: d.data() })); }
    return Local.list(col).map(d => ({ id: d.id, data: clone(d.data) }));
  },
  watch(col, cb) {
    if (S.mode === 'db') {
      return S.db.collection(col).onSnapshot(q => cb(q.docs.map(d => ({ id: d.id, data: d.data() }))), e => toast(dbErr(e)));
    }
    const pre = col + '/';
    const fn = p => { if (p.startsWith(pre) && !p.slice(pre.length).includes('/')) cb(Local.list(col)); };
    Local.listeners.add(fn); cb(Local.list(col));
    return () => Local.listeners.delete(fn);
  },
  watchDoc(path, cb) {
    if (S.mode === 'db') return S.db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null), e => toast(dbErr(e)));
    const fn = p => { if (p === path) cb(Local.mem.get(path) ?? null); };
    Local.listeners.add(fn); cb(Local.mem.get(path) ?? null);
    return () => Local.listeners.delete(fn);
  }
};

/* ---------- state ---------- */
const S = {
  mode: 'local', db: null, user: null, uid: 'local', isAdmin: true, canWrite: true, names: {},
  regMeta: null, regChunks: [], register: new Map(), regList: [], regDups: [],
  sessions: [], sid: null, curBase: null, lockedMeta: null, lockedReg: null, lockedRegList: null, lockWarn: false,
  entries: new Map(), audit: [], corrections: [], subs: [],
  view: 'dashboard', ver: 0,
  books: { filter: 'all', q: '', page: 0 },
  inv: { filter: 'open' }, aud: { q: '' }, reg: { q: '', page: 0 },
  scan: { tab: 'scan', quick: false, field: 'a', q: '', last: null },
  downloads: undefined, fileCache: {}, sheetCtx: null
};
function uiGet(k, d) { try { const v = localStorage.getItem('lsv-ui:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function uiSet(k, v) { try { localStorage.setItem('lsv-ui:' + k, JSON.stringify(v)); } catch (e) { } }

function sess() {
  const live = S.sessions.find(x => x.id === S.sid);
  if (!live) return null;
  if (live.status === 'Approved' && S.lockedMeta) return { ...S.lockedMeta, status: 'Approved', lockedAt: live.lockedAt };
  return live;
}
const isLocked = s => !!s && (s.status === 'Submitted' || s.status === 'Approved');
function nameOf(id) {
  if (S.mode === 'local') return id || '—';
  if (!id) return '—';
  return S.names[id] || (id === S.uid ? 'You' : 'Member ' + String(id).slice(-4));
}
async function resolveNames(ids) {
  if (!S.user || S.mode !== 'db') return;
  const miss = [...new Set(ids)].filter(i => i && !(i in S.names));
  if (!miss.length) return;
  miss.forEach(i => S.names[i] = '');
  try {
    const ps = await S.user.profiles(miss);
    for (const i of miss) S.names[i] = (ps[i] && ps[i].name) || '';
    bump();
  } catch (e) { }
}

/* ---------- stock register ---------- */
const recFromArr = arr => { const r = {}; REG_F.forEach((k, i) => { if (arr[i] !== '' && arr[i] != null) r[k] = arr[i]; }); return r; };
const recToArr = r => REG_F.map(k => r[k] ?? '');
function buildRegister(rows) {
  const map = new Map(), list = [], dupMap = new Map();
  for (const r of rows) {
    if (!r.a) continue;
    if (map.has(r.a)) {
      if (!dupMap.has(r.a)) dupMap.set(r.a, [map.get(r.a)]);
      dupMap.get(r.a).push(r);
      continue;
    }
    map.set(r.a, r); list.push(r);
  }
  list.sort((x, y) => cmpAcc(x.a, y.a));
  return { map, list, dups: [...dupMap.entries()].map(([a, recs]) => ({ a, recs })) };
}
function rebuildRegister() {
  const gen = S.regMeta && S.regMeta.gen;
  const docs = (S.regChunks || []).filter(d => d.data.gen === gen).sort((a, b) => a.data.idx - b.data.idx);
  const rows = [];
  for (const d of docs) for (const arr of d.data.rows || []) rows.push(recFromArr(arr));
  const b = buildRegister(rows);
  S.register = b.map; S.regList = b.list; S.regDups = b.dups;
  bump();
}
const regMap = () => S.lockedReg || S.register;
const regRec = acc => regMap().get(acc);

/* ---------- session model (derived) ---------- */
function inRange(s, acc) {
  if (!s) return false;
  const a = s.rangeStart, b = s.rangeEnd;
  if ((a === '' || a == null) && (b === '' || b == null)) return true;
  const n = accNum(acc); if (isNaN(n)) return false;
  return n >= (a === '' || a == null ? -Infinity : +a) && n <= (b === '' || b == null ? Infinity : +b);
}
function eff(rec, e) {
  if (e) return e.status;
  switch (rec && rec.st) {
    case 'Issued': return ST.IS;
    case 'Withdrawn': return ST.WD;
    case 'Transferred': return ST.TR;
    case 'Lost': return ST.MI;
    case 'Under Repair': return ST.UR;
    default: return ST.NV;
  }
}
const normLoc = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
let _M = null;
function model() {
  const s = sess(); if (!s) return null;
  if (_M && _M.ver === S.ver && _M.sid === s.id) return _M;
  const map = regMap(); const list = S.lockedRegList || S.regList;
  const rows = [];
  for (const rec of list) if (inRange(s, rec.a)) { const e = S.entries.get(rec.a); rows.push({ acc: rec.a, rec, e, status: eff(rec, e), extra: false }); }
  const extras = [];
  for (const e of S.entries.values()) if (!map.has(e.acc)) extras.push({ acc: e.acc, rec: { a: e.acc, ...(e.extra || {}) }, e, status: e.status, extra: true });
  extras.sort((x, y) => cmpAcc(x.acc, y.acc));
  const c = {}; STATUS_LIST.forEach(k => c[k] = 0);
  let phys = 0, cond = 0, value = 0, dupCopies = [];
  for (const r of rows) {
    c[r.status]++;
    if (r.e && PHYS.has(r.status) && r.e.method !== 'bulk') phys++;
    if (r.e && (r.e.dupCopies || 0) > 0) dupCopies.push(r);
    if ((r.status === ST.NF || r.status === ST.MI) && r.rec.pr) value += +r.rec.pr || 0;
  }
  const exCount = extras.filter(r => r.status !== ST.WA).length;
  const waExtra = extras.filter(r => r.status === ST.WA).length;
  const total = rows.length, pending = c[ST.NV], accounted = total - pending;
  // accession gaps within the range
  const gaps = [];
  const nums = rows.map(r => accNum(r.acc)).filter(n => !isNaN(n)).sort((a, b) => a - b);
  if (nums.length) {
    const lo = (s.rangeStart !== '' && s.rangeStart != null) ? +s.rangeStart : nums[0];
    const hi = (s.rangeEnd !== '' && s.rangeEnd != null) ? +s.rangeEnd : nums[nums.length - 1];
    const set = new Set(nums);
    let start = null;
    for (let n = lo; n <= hi && n - lo < 200000; n++) {
      if (!set.has(n)) { if (start === null) start = n; }
      else if (start !== null) { gaps.push([start, n - 1]); start = null; }
    }
    if (start !== null) gaps.push([start, hi]);
  }
  const gapCount = gaps.reduce((a, g) => a + g[1] - g[0] + 1, 0);
  const regDups = S.lockedReg ? (S.lockedMeta && S.lockedMeta.regDups || []) : S.regDups.filter(d => inRange(s, d.a));
  const locMismatch = rows.filter(r => r.e && PHYS.has(r.status) && r.e.foundRack && r.rec.rack && normLoc(r.e.foundRack) !== normLoc(r.rec.rack));
  const circMismatch = rows.filter(r => r.rec.st === 'Issued' && r.e && PHYS.has(r.status));
  const damaged = rows.concat(extras).filter(r => r.status === ST.DA || r.status === ST.UR || (r.e && (SEVERE.has(r.e.condition) || WORN.has(r.e.condition))));

    ver: S.ver, sid: s.id, s, rows, extras, c, phys, total, pending, accounted, gaps, gapCount, regDups, locMismatch, circMismatch,

}
function summaryOf(m) {
  return {
    total: m.total, accounted: m.accounted, phys: m.phys, available: m.c[ST.AV], issued: m.c[ST.IS], notFound: m.c[ST.NF],
    missing: m.c[ST.MI], damaged: m.c[ST.DA], repair: m.c[ST.UR], withdrawn: m.c[ST.WD], transferred: m.c[ST.TR],
    extra: m.exCount, duplicate: m.c[ST.DU] + m.dupCopies.length, wrongAcc: m.c[ST.WA] + m.waExtra, pending: m.pending,
    pct: +m.pctAcc.toFixed(1), value: m.value, at: Date.now()

}

/* ---------- boot ---------- */
let _rq = false;
function bump() { S.ver++; if (!_rq) { _rq = true; requestAnimationFrame(() => { _rq = false; render(); }); } }

async function boot() {
  await Local.load();
  S.view = uiGet('view', 'dashboard');
  S.scan.quick = uiGet('quick', false);
  const C = window.claude;
  let db = null, user = null;
  if (C && typeof C.use === 'function') {

const HEADER_ALIASES = {
  a: ['accession', 'accessionno', 'accno', 'accnumber', 'accessionnumber', 'accn', 'accnno'],
  t: ['title', 'booktitle', 'nameofbook'], au: ['author', 'authors', 'authorname'], p: ['publisher', 'publishers'],
  ed: ['edition'], isbn: ['isbn', 'isbnno'], sub: ['subject'], cls: ['class', 'classno', 'classnumber', 'classification', 'callno'],
  pr: ['price', 'cost', 'rate', 'amount'], pd: ['dateofpurchase', 'purchasedate', 'dateofreceipt', 'date'], sup: ['supplier', 'vendor', 'source'],
  bill: ['billno', 'billnumber', 'invoiceno', 'invoice', 'bill'], st: ['status', 'currentstatus', 'registerstatus'],
  rack: ['rack', 'racklocation', 'location', 'shelf', 'rackno'], lit: ['lastissuedto', 'issuedto', 'borrower', 'member'],
  lid: ['lastissuedate', 'issuedate', 'dateofissue'], lrd: ['lastreturndate', 'returndate', 'dateofreturn']

function normStatus(v) {
  const s = String(v || '').toLowerCase();

  if (/issu|loan|circul/.test(s)) return 'Issued';
  if (/withdr|written|discard|weed|condemn/.test(s)) return 'Withdrawn';
  if (/transf/.test(s)) return 'Transferred';

  if (/repair|bind/.test(s)) return 'Under Repair';

}
function normDateCell(v) {

}

    const a = normAcc(row[idx.a]);
    if (!a) { if (row.some(c => String(c ?? '').trim())) skipped++; continue; }
    const r = { a };
    for (const k of REG_F) if (k !== 'a' && idx[k] !== undefined) {
      let v = row[idx[k]]; if (v == null) continue;
      if (k === 'pd' || k === 'lid' || k === 'lrd') v = normDateCell(v);
      else if (k === 'pr') { const n = parseFloat(String(v).replace(/[^0-9.]/g, '')); v = isNaN(n) ? '' : n; }

}

      else f += ch;
    } else if (ch === '"') q = true;

    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }

}

  const N = 1200;
  for (let n = 1; n <= N; n++) {
    if (gaps.has(n)) continue;
    if (!batch || rnd() < 0.035) {
      const frac = n / N; const y = 2011 + Math.floor(frac * 15); const mth = 1 + Math.floor(rnd() * 12);
      batch = { pd: `${Math.min(y, 2026)}-${String(mth).padStart(2, '0')}-${String(1 + Math.floor(rnd() * 27)).padStart(2, '0')}`, sup: pick(suppliers), bill: `B/${Math.min(y, 2026)}/${100 + Math.floor(rnd() * 800)}` };
    }
    const b = pick(SAMPLE_BOOKS);
    const ncert = b[2] === 'NCERT';
    const r = {
      a: String(n), t: b[0], au: b[1], p: b[2], ed: pick(editions), sub: b[3], cls: b[4],
      pr: ncert ? 45 + Math.floor(rnd() * 12) * 10 : 150 + Math.floor(rnd() * 70) * 10,
      pd: batch.pd, sup: batch.sup, bill: batch.bill, rack: SUBJECT_RACK[b[3]] + '/' + 'ABCDE'[Math.floor(rnd() * 5)], st: 'Available'
    };
    if (!ncert) r.isbn = isbn();
    const x = rnd();
    if (x < 0.055) { r.st = 'Issued'; r.lit = pick(borrowers); r.lid = `2026-${String(7 + Math.floor(rnd() * 3)).padStart(2, '0')}-${String(1 + Math.floor(rnd() * 27)).padStart(2, '0')}`; }
    else if (x < 0.065) r.st = 'Withdrawn';
    else if (x < 0.07) r.st = 'Transferred';
    else if (x < 0.074) r.st = 'Under Repair';
    else if (x < 0.076) r.st = 'Lost';
    if (r.st === 'Available' && rnd() < 0.3) { r.lit = pick(borrowers); r.lid = `2025-${String(4 + Math.floor(rnd() * 8)).padStart(2, '0')}-1${Math.floor(rnd() * 9)}`; r.lrd = r.lid.slice(0, 8) + '2' + Math.floor(rnd() * 8); }
    recs.push(r);
  }
  recs.push({ a: '615', t: 'Rashmirathi', au: 'Ramdhari Singh Dinkar', p: 'Lokbharti Prakashan', ed: '2nd', sub: 'Hindi Literature', cls: 'General', pr: 180, pd: '2019-07-11', sup: suppliers[0], bill: 'B/2019/412', rack: 'R-19/B', st: 'Available' });

}
async function demoVerification() {
  const m = model(); if (!m) return;
  let seed = 4242; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const byBucket = {}; const now = Date.now(); let n = 0;
  const put = (acc, e) => { (byBucket[bucketOf(acc)] ||= {})[keyOf(acc)] = { acc, at: now - Math.floor(rnd() * 5 * 86400000), firstAt: now, by: S.uid, method: 'scan', ...e }; n++; };
  let foundIssued = false;
  for (const r of m.rows) {
    if (r.e) continue;
    const rs = r.rec.st;
    if (rs === 'Withdrawn' || rs === 'Transferred' || rs === 'Lost') continue;
    if (rs === 'Issued') { if (!foundIssued && rnd() < 0.2) { foundIssued = true; put(r.acc, { status: ST.AV, condition: 'Good', foundRack: r.rec.rack, remarks: 'Found on shelf although issue register shows it issued.' }); } continue; }
    const x = rnd();
    if (x < 0.04) continue; // still pending
    if (x < 0.065) put(r.acc, { status: ST.NF, condition: '', method: 'manual', remarks: 'Not located on the rack or adjoining racks.' });
    else if (x < 0.075) put(r.acc, { status: ST.DA, condition: pick(['Termite Damaged', 'Binding Damaged', 'Pages Missing', 'Water Damaged']), foundRack: r.rec.rack, damage: { nature: 'Observed during verification', action: pick(['Repair', 'Rebind', 'Replace', 'Withdraw']) } });
    else if (x < 0.09) put(r.acc, { status: ST.AV, condition: pick(['Poor', 'Pages Oxidised']), foundRack: r.rec.rack });
    else if (x < 0.096) put(r.acc, { status: ST.AV, condition: 'Good', foundRack: 'R-' + String(1 + Math.floor(rnd() * 20)).padStart(2, '0') + '/A', remarks: 'Found shelved on the wrong rack.' });
    else put(r.acc, { status: ST.AV, condition: rnd() < 0.8 ? 'Good' : 'Fair', foundRack: r.rec.rack });
  }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  const k300 = (byBucket[bucketOf('300')] || {})[keyOf('300')];
  if (k300) { k300.dupCopies = 1; k300.dupNote = 'A second physical copy also carries accession no. 300.'; }
  put('UNLABELLED-1', { status: ST.EX, condition: 'Good', foundRack: 'R-03/A', extra: { t: 'Wings of Fire', au: 'A. P. J. Abdul Kalam', p: 'Universities Press', ed: 'Reprint 2021', pr: 350 }, remarks: 'Book carries no accession label.' });
  put('1250', { status: ST.EX, condition: 'Fair', foundRack: 'R-07/C', extra: { t: 'Gitanjali', au: 'Rabindranath Tagore', p: 'Visva-Bharati', ed: '2nd', pr: 220 }, remarks: 'Accession label present but number not in register.' });
  put('12O4', { status: ST.WA, condition: 'Good', foundRack: 'R-05/D', extra: { t: 'Malgudi Days', au: 'R. K. Narayan', p: 'Indian Thought Publications', note: 'Possibly 1204 (letter O written for zero)' }, remarks: 'Accession number appears mis-written.' });
  try {
    for (const [b, items] of Object.entries(byBucket)) await Store.merge(`${S.curBase}/buckets/${b}`, { items });
    await logEvent({ action: 'Sample verification data generated', acc: '', prev: '', next: '', remarks: `${n} sample verification records created for trying the module.` });
    if (m.s.status === 'Not Started') await updateSession({ status: 'In Progress' }, '', true);
    toast(`${nf(n)} sample verification records added.`);
  } catch (e) { toast(dbErr(e)); }
}

    const pool = m.rows.concat(m.extras);
    const get = { a: r => r.acc, t: r => r.rec.t, au: r => r.rec.au, isbn: r => r.rec.isbn, sub: r => r.rec.sub, cls: r => r.rec.cls, rack: r => r.rec.rack };
    const g = get[f] || get.t;
    res = pool.filter(r => String(g(r) || '').toLowerCase().includes(q));
    if (f === 'a') res.sort((x, y) => (x.acc.toLowerCase() === q ? -1 : 0) - (y.acc.toLowerCase() === q ? -1 : 0) || cmpAcc(x.acc, y.acc));
  }
  return `<div class="scanbox"><div class="grid3">
    <label class="f"><span>Search by</span><select data-chg="search-field">${[['a', 'Accession number'], ['t', 'Title'], ['au', 'Author'], ['isbn', 'ISBN'], ['sub', 'Subject'], ['cls', 'Class'], ['rack', 'Rack']].map(([k, l]) => `<option value="${k}" ${k === f ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="f" style="grid-column:span 2"><span>Search</span><input id="search-q" type="search" value="${esc(S.scan.q)}" data-in="search-q" placeholder="Type to search this session's books"></label>
  </div></div>
  ${q ? `<p class="small muted" style="margin-top:10px">${nf(res.length)} match${res.length === 1 ? '' : 'es'}${res.length > 60 ? ', showing the first 60' : ''}.</p>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Acc. No.</th><th>Title</th><th>Rack</th><th>Status</th><th></th></tr></thead><tbody>
  ${res.slice(0, 60).map(r => `<tr><td class="acc">${esc(r.acc)}</td><td class="t">${esc(r.rec.t || '')}<span class="sub">${esc(r.rec.au || '')}</span></td><td>${esc(r.rec.rack || '')}</td><td>${badge(r.status)}</td>
    <td><button class="btn sm ${r.status === ST.NV ? 'primary' : ''}" data-act="open-book" data-acc="${esc(r.acc)}" data-method="manual">${r.status === ST.NV && canWork() ? 'Verify' : 'Open'}</button></td></tr>`).join('')}
  </tbody></table></div>` : ''}`;
}

/* ---------- book-by-book ---------- */
const BOOK_FILTERS = [
  ['all', 'All'], ['verified', 'Verified'], ['pending', 'Not verified'], [ST.MI, 'Missing'], [ST.NF, 'Not found'], ['damaged', 'Damaged'],
  [ST.IS, 'Issued'], [ST.WD, 'Withdrawn'], [ST.TR, 'Transferred'], [ST.UR, 'Under repair'], ['extra', 'Extra books'], ['flags', 'Discrepancies']
];
function filterRows(m, f) {
  const all = m.rows;
  switch (f) {
    case 'all': return all.concat(m.extras);
    case 'verified': return all.filter(r => r.status !== ST.NV);
    case 'pending': return all.filter(r => r.status === ST.NV);
    case 'damaged': return m.damaged;
    case 'extra': return m.extras;
    case 'flags': {
      const set = new Set([...m.locMismatch, ...m.circMismatch, ...m.dupCopies].map(r => r.acc));
      return all.filter(r => set.has(r.acc) || r.status === ST.DU || r.status === ST.WA || m.regDups.some(d => d.a === r.acc)).concat(m.extras.filter(r => r.status === ST.WA));
    }
    case ST.AV: return all.filter(r => r.status === ST.AV);
    default: return all.concat(m.extras).filter(r => r.status === f);
  }
}
VIEWS.books = (s, m) => {
  if (!s || !m) return noSession();
  const B = S.books; const q = B.q.trim().toLowerCase();
  let rows = filterRows(m, B.filter);
  if (q) rows = rows.filter(r => [r.acc, r.rec.t, r.rec.au, r.rec.p, r.rec.rack, r.rec.isbn].some(v => String(v || '').toLowerCase().includes(q)));
  const per = 50, pages = Math.max(1, Math.ceil(rows.length / per)); B.page = Math.min(B.page, pages - 1);
  const shown = rows.slice(B.page * per, B.page * per + per);
  const cnt = f => filterRows(m, f).length;
  return `<div class="spread"><div><h1>Book-by-book verification</h1><p class="muted">Every accession number in the range, traced from the stock register to its physical status.</p></div>
    <input id="books-q" type="search" style="max-width:320px" placeholder="Search accession, title, author, rack" value="${esc(B.q)}" data-in="books-q"></div>
  <div class="chips" role="group" aria-label="Filter">${BOOK_FILTERS.map(([k, l]) => `<button class="chip" data-act="books-filter" data-f="${esc(k)}" aria-pressed="${B.filter === k}">${l}<span class="n">${nf(cnt(k))}</span></button>`).join('')}</div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Accession No.</th><th>Title</th><th>Author</th><th>Publisher</th><th>Book status</th><th>Physical status</th><th>Condition</th><th>Location</th><th>Remarks</th></tr></thead><tbody>
  ${shown.length ? shown.map(r => {
    const loc = r.e && r.e.foundRack ? r.e.foundRack : r.rec.rack;
    const moved = r.e && r.e.foundRack && r.rec.rack && normLoc(r.e.foundRack) !== normLoc(r.rec.rack);
    return `<tr class="click" data-act="open-book" data-acc="${esc(r.acc)}"><td class="acc">${esc(r.acc)}</td><td class="t">${esc(r.rec.t || '—')}</td><td>${esc(r.rec.au || '')}</td><td>${esc(r.rec.p || '')}</td>
    <td>${r.extra ? '<span class="badge t-blue-o">Not in register</span>' : esc(r.rec.st || 'Available')}</td><td>${badge(r.status)}${r.e && r.e.dupCopies ? ' <span class="badge t-red-o">+' + r.e.dupCopies + ' copy</span>' : ''}</td>
    <td>${esc(r.e && r.e.condition || '')}</td><td>${esc(loc || '')}${moved ? `<span class="sub">Register: ${esc(r.rec.rack)}</span>` : ''}</td><td class="small">${esc((r.e && r.e.remarks) || '')}</td></tr>`;
  }).join('') : `<tr><td colspan="9" class="muted" style="text-align:center;padding:26px">No books match this filter.</td></tr>`}
  </tbody></table></div>
  <div class="pager"><span>${rows.length ? `${nf(B.page * per + 1)} to ${nf(Math.min(rows.length, B.page * per + per))} of ${nf(rows.length)}` : ''}</span>
    <span class="row"><button class="btn sm" data-act="books-page" data-d="-1" ${B.page === 0 ? 'disabled' : ''}>Previous</button><button class="btn sm" data-act="books-page" data-d="1" ${B.page >= pages - 1 ? 'disabled' : ''}>Next</button></span></div>`;
};

/* ---------- reconciliation ---------- */
function summaryRows(m) {
  return [
    ['Total books as per stock register', m.total, true],
    ['Total books verified (accounted for)', m.accounted, true],
    ['Physically verified on shelves', m.phys, true],
    ['Physically available', m.c[ST.AV], true],
    ['Issued (as per issue register)', m.c[ST.IS], true],
    ['Not found', m.c[ST.NF], true],
    ['Missing / lost', m.c[ST.MI], true],
    ['Damaged', m.c[ST.DA], true],
    ['Under repair', m.c[ST.UR], true],
    ['Withdrawn', m.c[ST.WD], true],
    ['Transferred to another library', m.c[ST.TR], true],
    ['Duplicate accession (status)', m.c[ST.DU], true],
    ['Wrong accession number', m.c[ST.WA] + m.waExtra, false],
    ['Pending verification', m.pending, true],
    ['Extra / unrecorded books found', m.exCount, false]
  ];
}
function discList(title, sub, rows, cols, count) {
  return `<details class="disc"><summary><span><b>${title}</b><span class="sub muted small" style="display:block">${sub}</span></span><span class="n">${nf(count ?? rows.length)}</span></summary>
    <div class="inner">${rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>
    ${rows.slice(0, 300).map(r => `<tr ${r.acc ? `class="click" data-act="open-book" data-acc="${esc(r.acc)}"` : ''}>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>${rows.length > 300 ? `<p class="small muted">Showing 300 of ${nf(rows.length)}. Export the discrepancy report for the full list.</p>` : ''}` : '<p class="muted small">None.</p>'}</div></details>`;
}
VIEWS.reconcile = (s, m) => {
  if (!s || !m) return noSession();
  const A = r => `<span class="acc">${esc(r.acc)}</span>`, T = r => esc(r.rec.t || '—');
  const notFound = m.rows.filter(r => r.status === ST.NF || r.status === ST.MI || r.status === ST.NV);
  const dupRows = [
    ...m.regDups.map(d => ({ acc: d.a, rec: d.recs[0], detail: `Entered ${d.recs.length} times in the stock register: ${d.recs.map(x => x.t).join(' / ')}` })),
    ...m.dupCopies.map(r => ({ ...r, detail: `${r.e.dupCopies + 1} physical copies carry this number. ${r.e.dupNote || ''}` })),
    ...m.rows.filter(r => r.status === ST.DU).map(r => ({ ...r, detail: r.e.remarks || 'Marked duplicate during verification' }))
  ];
  const gapRows = m.gaps.map(g => ({ acc: '', rec: {}, range: g[0] === g[1] ? String(g[0]) : `${g[0]} to ${g[1]}`, n: g[1] - g[0] + 1 }));
  const flow = ['Create session', 'Select stock range', 'Scan / search', 'Physical verification', 'Record condition', 'Reconcile', 'Identify discrepancies', 'Prepare summary', 'Review', 'Submit', 'Final report', 'Lock record'];
  const stage = s.status === 'Approved' ? 12 : s.status === 'Submitted' ? 10 : s.status === 'Completed' ? 8 : s.status === 'In Progress' ? (m.pending ? 4 : 7) : 2;
  return `<div class="spread"><div><h1>Reconciliation</h1><p class="muted">Stock register quantity compared with physically verified quantity.</p></div>
    <div class="row"><button class="btn" data-act="export" data-r="discrepancy" data-fmt="xlsx">Export discrepancies</button></div></div>
  <ol class="flow">${flow.map((f, i) => `<li class="${i + 1 < stage ? 'done' : i + 1 === stage ? 'now' : ''}">${f}</li>`).join('')}</ol>
  <div class="section"><h2>Reconciliation summary</h2>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Particulars</th><th class="r">Books</th><th class="r">% of register</th></tr></thead><tbody>
    ${summaryRows(m).map(([l, v, p]) => `<tr><td>${l}</td><td class="r num">${nf(v)}</td><td class="r num">${p ? pct(v, m.total) : '—'}</td></tr>`).join('')}
    <tr><td><b>Unaccounted difference</b> <span class="sub">Register total less found, issued, withdrawn and transferred</span></td><td class="r num"><b>${nf(m.total - m.phys - m.c[ST.IS] - m.c[ST.WD] - m.c[ST.TR])}</b></td><td class="r num">${pct(m.total - m.phys - m.c[ST.IS] - m.c[ST.WD] - m.c[ST.TR], m.total)}</td></tr>
    <tr><td>Value of books not found or missing</td><td class="r num">${inr(m.value) || '₹0'}</td><td></td></tr>
    </tbody></table></div>
  </div>
  <h2 style="margin-top:22px">Discrepancies</h2>
  ${discList('In register but not physically found', 'Not found, missing, or not yet verified', notFound, [['Acc. No.', A], ['Title', T], ['Rack', r => esc(r.rec.rack || '')], ['Status', r => badge(r.status)]])}
  ${discList('Physically found but absent from register', 'Extra or unrecorded books, and labels with wrong numbers', m.extras, [['Label', A], ['Title', T], ['Found at', r => esc(r.e.foundRack || '')], ['Status', r => badge(r.status)], ['Remarks', r => esc(r.e.remarks || r.rec.note || '')]])}
  ${discList('Duplicate accession numbers', 'In the register, or found on more than one physical copy', dupRows, [['Acc. No.', A], ['Title', T], ['Detail', r => esc(r.detail)]])}
  ${discList('Missing accession numbers', 'Numbers absent from the register sequence', gapRows, [['Accession numbers', r => `<span class="acc">${esc(r.range)}</span>`], ['Count', r => nf(r.n)]], m.gapCount)}
  ${discList('Recorded as issued', 'Accounted for through the issue register', m.rows.filter(r => r.status === ST.IS), [['Acc. No.', A], ['Title', T], ['Issued to', r => esc(r.rec.lit || '')], ['Issue date', r => fmtDate(r.rec.lid)]])}
  ${discList('Found on shelf but shown as issued', 'Issue register needs correcting', m.circMismatch, [['Acc. No.', A], ['Title', T], ['Register says issued to', r => esc(r.rec.lit || '')], ['Found at', r => esc(r.e.foundRack || '')]])}
  ${discList('Damaged', 'Damaged, under repair, or in poor condition', m.damaged, [['Acc. No.', A], ['Title', T], ['Condition', r => esc(r.e && r.e.condition || '')], ['Status', r => badge(r.status)]])}
  ${discList('Withdrawn', 'Withdrawn from stock', m.rows.filter(r => r.status === ST.WD), [['Acc. No.', A], ['Title', T], ['Remarks', r => esc(r.e && r.e.remarks || 'As per register')]])}
  ${discList('Transferred to another library', 'As per register or verification', m.rows.filter(r => r.status === ST.TR), [['Acc. No.', A], ['Title', T], ['Remarks', r => esc(r.e && r.e.remarks || 'As per register')]])}
  ${discList('Incorrect location', 'Found on a different rack from the register', m.locMismatch, [['Acc. No.', A], ['Title', T], ['Register rack', r => esc(r.rec.rack)], ['Found at', r => esc(r.e.foundRack)]])}
  <div class="section"><h2>Review and submit</h2>${workflowPanel(s, m)}</div>`;
};
function workflowPanel(s, m) {
  const parts = [];
  if (s.status === 'Not Started' || s.status === 'In Progress') {
    if (m.pending && S.canWrite) parts.push(`<div class="notice">${nf(m.pending)} books have not been verified. Keep scanning, or once the search is complete, record the rest as Not Found so they enter the missing-book investigation.</div>
      <button class="btn" data-act="bulk-nf">Mark ${nf(m.pending)} unverified books Not Found</button>`);
    if (S.canWrite) parts.push(`<button class="btn primary" data-act="sess-complete" ${m.pending ? 'disabled' : ''}>Mark verification completed</button>`);
  }
  if (s.status === 'Completed') {
    parts.push(`<p>Verification is complete. Review the summary, discrepancies and final remarks, then submit. After submission only an authorized officer can change records.</p>`);
    if (S.canWrite) parts.push(`<div class="row"><button class="btn" data-act="sess-reopen">Reopen for scanning</button><button class="btn primary" data-act="sess-submit">Submit for approval</button></div>`);
  }
  if (s.status === 'Submitted') {
    parts.push(`<p>Submitted on ${fmtDT(s.submittedAt)} by ${esc(nameOf(s.submittedBy))}.</p>`);
    if (S.isAdmin) parts.push(`<div class="row"><button class="btn" data-act="sess-return">Return for correction</button><button class="btn primary" data-act="sess-approve">Approve and lock</button></div>`);
    else parts.push('<p class="muted">Waiting for an authorized officer to approve.</p>');
  }
  if (s.status === 'Approved') parts.push(`<div class="notice ok">Approved on ${fmtDT(s.approvedAt)} by ${esc(nameOf(s.approvedBy))}. This verification is part of the permanent record. Corrections need an authorized officer and appear in the audit trail.</div>
    <button class="btn primary" data-act="final-preview">Open final verification report</button>`);
  return parts.join('<div style="height:10px"></div>');
}

/* ---------- missing book investigation ---------- */

  <div class="chips">${[['open', 'Open'], ['nf', 'Not found'], ['mi', 'Missing'], ['rec', 'Recovered'], ['all', 'All']].map(([k, l]) => `<button class="chip" data-act="inv-filter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Acc. No.</th><th>Title</th><th class="r">Price</th><th>Last known location</th><th>Last issued to</th><th>Status</th><th>Recovery</th><th>Responsibility</th></tr></thead><tbody>
  ${rows.length ? rows.map(r => { const iv = (r.e && r.e.inv) || {}; return `<tr class="click" data-act="open-inv" data-acc="${esc(r.acc)}"><td class="acc">${esc(r.acc)}</td><td class="t">${esc(r.rec.t)}<span class="sub">${esc(r.rec.au || '')}</span></td>
    <td class="r num">${inr(r.rec.pr)}</td><td>${esc(iv.lastKnown || r.rec.rack || '')}</td><td>${esc(r.rec.lit || '—')}${r.rec.lid ? `<span class="sub">${fmtDate(r.rec.lid)}</span>` : ''}</td>

/* ---------- audit trail ---------- */
VIEWS.audit = (s, m) => {

  const ev = q ? S.audit.filter(e => [e.acc, e.action, e.prev, e.next, e.remarks, nameOf(e.uid)].some(v => String(v || '').toLowerCase().includes(q))) : S.audit;
  const pend = S.corrections.filter(c => c.state === 'Pending');
  return `<div class="spread"><div><h1>Audit trail</h1><p class="muted">Every verification action is recorded here and cannot be edited.</p></div>
    <div class="row"><button class="btn" data-act="export" data-r="audit" data-fmt="xlsx">Excel</button><button class="btn" data-act="export" data-r="audit" data-fmt="pdf">PDF</button></div></div>

async function saveSessionForm(edit) {
  const g = id => ($('#' + id) || {}).value?.trim() ?? '';
  const d = {
    vid: g('s-vid'), date: g('s-date'), title: g('s-title'), period: g('s-period'), regRange: g('s-regrange'), school: g('s-school'), library: g('s-library'),
    officer: g('s-officer'), committee: g('s-committee').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 12), rangeStart: g('s-start'), rangeEnd: g('s-end'), remarks: g('s-remarks')
  };
  const miss = [['vid', 'Verification ID'], ['date', 'Verification date'], ['title', 'Title'], ['school', 'School name'], ['library', 'Library name'], ['officer', 'Verification officer']].filter(([k]) => !d[k]);
  if (miss.length) return toast('Fill in: ' + miss.map(x => x[1]).join(', ') + '.');
  if (d.rangeStart !== '' && d.rangeEnd !== '' && +d.rangeStart > +d.rangeEnd) return toast('The starting accession number must not be larger than the ending number.');
  if (edit) {
    const s = sess();
    const reason = g('s-reason');
    if (isLocked(s) && !reason) return toast('Enter the reason for changing a locked session.');
    await updateSession({ ...d, _remarks: undefined }, 'Session details edited');
    if (isLocked(s)) logEvent({ action: 'Session details corrected', acc: '', prev: '', next: '', remarks: reason, authorized: true });
    closeSheet(); toast('Details saved.');
    return;
  }
  const id = 's' + Date.now().toString(36);
  const doc = { ...d, status: 'Not Started', createdAt: Date.now(), createdBy: S.uid, finalRemarks: { observations: '', recommendations: '' } };
  try {
    await Store.set(`sessions/${id}`, doc);
    // prepare record buckets for the range so concurrent scanners share them
    const s = { ...doc, id };
    const buckets = new Set(S.regList.filter(r => inRange(s, r.a)).map(r => bucketOf(r.a)));
    for (const b of buckets) await Store.set(`sessions/${id}/buckets/${b}`, { items: {} });
    await logEvent({ action: 'Session created', acc: '', prev: '', next: 'Not Started', remarks: `${d.title}; accession ${d.rangeStart || '…'} to ${d.rangeEnd || '…'}` }, `sessions/${id}`);
    S.sid = id; uiSet('sid', id); closeSheet(); toast('Verification session created.');
    S.view = 'dashboard'; uiSet('view', 'dashboard');
  } catch (e) { toast(dbErr(e)); }
}

async function saveInv(acc, to) {

  if (S.isAdmin) {
    const resp = g('i-resp');

  }
  const patch = { inv };

  const ok = await saveEntry(acc, patch, { action, reason, note });

}

  openSheet(head('Scan with camera', 'Hold the barcode or QR code steady inside the frame.') + `<div class="cam"><video id="cam-v" playsinline muted></video></div><p id="cam-msg" class="small muted">Starting camera…</p>

function discrepancyRows(m) {

  m.dupCopies.forEach(r => out.push({ type: 'Duplicate physical copy', acc: r.acc, title: r.rec.t, detail: `${r.e.dupCopies + 1} copies carry this number. ${r.e.dupNote || ''}` }));
  m.rows.filter(r => r.status === ST.DU).forEach(r => out.push({ type: 'Marked duplicate', acc: r.acc, title: r.rec.t, detail: r.e.remarks || '' }));
  m.gaps.forEach(g => out.push({ type: 'Missing from register sequence', acc: g[0] === g[1] ? String(g[0]) : `${g[0]} to ${g[1]}`, title: '', detail: `${g[1] - g[0] + 1} number(s) not in the stock register` }));
  m.rows.filter(r => r.status === ST.WA).concat(m.extras.filter(r => r.status === ST.WA)).forEach(r => out.push({ type: 'Wrong accession number', acc: r.acc, title: r.rec.t || '', detail: [r.e.remarks, r.e.extra && r.e.extra.note].filter(Boolean).join('. ') }));
  m.locMismatch.forEach(r => out.push({ type: 'Incorrect location', acc: r.acc, title: r.rec.t, detail: `Register: ${r.rec.rack}; found at: ${r.e.foundRack}` }));
  m.circMismatch.forEach(r => out.push({ type: 'Shown issued but on shelf', acc: r.acc, title: r.rec.t, detail: `Issue register: ${r.rec.lit || 'issued'}${r.rec.lid ? ' on ' + fmtDate(r.rec.lid) : ''}` }));
  return out;
}
